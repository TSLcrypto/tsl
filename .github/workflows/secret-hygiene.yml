name: Secret hygiene

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  scan-tracked-content:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reject tracked secret-like files and markers
        shell: python
        run: |
          import re
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(
              ["git", "ls-files", "-z"], text=False
          ).decode("utf-8").split("\0")
          tracked = [p for p in tracked if p]

          risky_names = [
              re.compile(r"(^|/)(\.env|\.env\.[^/]+)$", re.I),
              re.compile(r"(^|/)(keystore|keystores|secrets|credentials)/", re.I),
              re.compile(r"(^|/)(private[-_]?key|mnemonic|seed)(\.[^/]+)?$", re.I),
              re.compile(r"\.(pem|p12|pfx|jks|keystore)$", re.I),
          ]

          marker_patterns = [
              ("private key block", re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----")),
              ("GitHub token", re.compile(r"\b(?:ghp|github_pat)_[A-Za-z0-9_]{20,}\b")),
              ("AWS access key", re.compile(r"\bAKIA[0-9A-Z]{16}\b")),
              ("generic bearer token", re.compile(r"(?i)authorization\s*:\s*bearer\s+[A-Za-z0-9._~+\-/=]{20,}")),
          ]

          allowed_text_suffixes = {
              ".md", ".txt", ".json", ".yml", ".yaml", ".sol", ".py",
              ".js", ".ts", ".cjs", ".mjs", ".html", ".css", ".toml"
          }

          failures = []

          for path in tracked:
              normalized = path.replace("\\", "/")
              if any(rx.search(normalized) for rx in risky_names):
                  failures.append(f"tracked secret-like filename: {path}")

              p = Path(path)
              if p.suffix.lower() not in allowed_text_suffixes and p.name not in {".gitignore"}:
                  continue

              try:
                  text = p.read_text(encoding="utf-8", errors="ignore")
              except OSError:
                  continue

              for label, rx in marker_patterns:
                  if rx.search(text):
                      failures.append(f"{label} marker found in: {path}")

          if failures:
              print("Secret hygiene check failed:")
              for failure in sorted(set(failures)):
                  print(f" - {failure}")
              raise SystemExit(1)

          print("Secret hygiene checks passed.")
