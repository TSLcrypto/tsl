name: TSL API

on:
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/tsl-api.yml'
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - '.github/workflows/tsl-api.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
        working-directory: api
